/* ===== Chapel In-Charge visual refresh (CSS-only; app logic preserved) ===== */
:root{
  --bg:#f4f6fa;
  --card:#ffffff;
  --ink:#202b3d;
  --mut:#68758a;
  --ln:#dfe5ee;
  --ok:#27794c;
  --gd:#c69a43;
  color-scheme:light;
}
:root[data-theme="dark"]{color-scheme:dark}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark}}
html{scroll-behavior:smooth;scrollbar-gutter:stable}
body{
  background:var(--bg);
  color:var(--ink);
  letter-spacing:.005em;
  -webkit-tap-highlight-color:transparent;
}
button,select,input,textarea{font:inherit}
button{transition:background-color .18s ease,border-color .18s ease,transform .18s ease,box-shadow .18s ease}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{
  outline:3px solid color-mix(in srgb,var(--gd) 72%,transparent);
  outline-offset:2px;
}
header{
  padding:13px 16px;
  gap:10px;
  background:linear-gradient(115deg,#1b2738 0%,#283a52 100%);
  border-bottom:2px solid var(--gd);
  box-shadow:0 5px 18px #11182720;
}
header h1{font-size:19px;letter-spacing:.01em;text-shadow:0 1px 2px #0002}
header>div{display:flex;align-items:center;gap:7px}
header select,header button{
  min-height:42px;
  border:1px solid #ffffff20;
  border-radius:13px;
  background:#ffffff16;
  padding:8px 11px;
  box-shadow:inset 0 1px #ffffff0a;
}
header select{max-width:105px}
header button{min-width:42px}
header button:active{transform:scale(.96)}
main{width:100%;max-width:760px;padding:18px 16px calc(112px + env(safe-area-inset-bottom,0px));}
section{margin:24px 0}
h2{font-size:19px;letter-spacing:-.015em;margin:0 0 10px}
section h2{display:flex;align-items:center;gap:9px}
section h2:before{content:"";display:inline-block;width:4px;height:19px;border-radius:5px;background:var(--gd);flex:none}
.nt,small{line-height:1.5}
.nt{margin:5px 0 10px}
.it{
  background:var(--card);
  border:1px solid var(--ln);
  border-radius:16px;
  margin:10px 0;
  padding:13px 14px;
  box-shadow:0 3px 12px #17243a08;
  transition:border-color .18s ease,box-shadow .18s ease,transform .18s ease;
}
.it:has(>label input:not(:disabled)){cursor:default}
.it>label{gap:12px;align-items:flex-start}
.it>label b{font-weight:650;line-height:1.4}
.it>label small{margin-top:4px;line-height:1.55}
input[type=checkbox]{width:21px;height:21px;accent-color:var(--ac);border-radius:6px;cursor:pointer}
.tg{border-radius:999px;padding:3px 8px;font-weight:650;letter-spacing:.015em}
details{margin-top:9px}
summary{padding:4px 0;font-weight:650}
.sb{padding:5px 0;line-height:1.45}
.pb{height:9px;border-radius:999px;margin-top:12px;background:var(--ln)}
.pb i{border-radius:999px}
.dt{gap:12px;margin:12px 0 8px;padding:12px 8px;background:var(--card);border:1px solid var(--ln);border-radius:16px;box-shadow:0 3px 12px #17243a08}
.dt b{font-size:17px}
.dt button{width:42px;height:42px;border-radius:13px;font-weight:500;box-shadow:0 2px 4px #17243a0a}
.dt button:hover{border-color:var(--ac);background:var(--acs)}
.lk{border-radius:12px;text-decoration:none}
.lk:hover{background:var(--acs)}
.big{border:1px solid color-mix(in srgb,var(--ac) 12%,var(--ln));padding:14px;border-radius:15px}
.ctl{gap:9px;margin:12px 0}
.ctl select,.nm,textarea.nm,input[type=time],input[type=number],input[type=search],input[type=email],input[type=password],input[type=text]{
  min-height:44px;border:1px solid var(--ln);border-radius:12px;background:var(--card);color:var(--ink);padding:10px 12px;
}
textarea.nm{min-height:92px;resize:vertical}
.sw{gap:8px;font-size:14px}
.seg{gap:7px;margin:10px 0}
.seg button{min-height:42px;padding:9px 12px;border-radius:12px;font-weight:600;box-shadow:0 1px 2px #17243a06}
.seg .on{box-shadow:0 4px 10px color-mix(in srgb,var(--ac) 20%,transparent)}
.su{min-height:48px;gap:12px;padding:12px 14px;margin:8px 0;border-radius:14px;box-shadow:0 2px 8px #17243a08}
.su:hover{border-color:color-mix(in srgb,var(--ac) 45%,var(--ln));transform:translateY(-1px)}
.su:active,.pr:active{transform:scale(.985)}
.pl{padding:11px 10px;border-bottom:1px solid var(--ln);border-radius:8px;line-height:1.45}
.pl.now{outline:1px solid color-mix(in srgb,var(--ac) 18%,transparent)}
.pr{min-height:46px;padding:12px 16px;border-radius:13px;box-shadow:0 5px 12px color-mix(in srgb,var(--ac) 18%,transparent)}
.pr:hover{filter:brightness(1.04)}
.s0 b{color:var(--ok)}
nav{
  gap:4px;
  padding:8px 7px calc(7px + env(safe-area-inset-bottom,0px));
  background:color-mix(in srgb,var(--card) 92%,transparent);
  border-top:1px solid var(--ln);
  box-shadow:0 -8px 24px #14203512;
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  z-index:20;
}
nav button{
  min-width:0;min-height:53px;padding:7px 2px 6px;border:1px solid transparent;border-radius:13px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  font-size:11px;line-height:1.15;color:var(--mut);overflow-wrap:anywhere;
}
nav button span{font-size:19px;line-height:1.1}
nav button.on{background:var(--acs);color:var(--ac);font-weight:750;border-color:color-mix(in srgb,var(--ac) 10%,transparent)}
nav button.nd:after{top:3px;left:calc(50% + 8px)}
.hero{
  position:relative;isolation:isolate;overflow:hidden;
  border:1px solid #ffffff12;
  border-radius:24px;
  padding:35px 24px 32px;
  margin:7px 0 16px;
  min-height:170px;
  display:flex;align-items:center;
  background:radial-gradient(circle at 92% 10%,#d4b36b24 0,transparent 34%),linear-gradient(135deg,#1a2638 0%,#2b3d55 100%);
  box-shadow:0 12px 28px #19273b20;
}
.hero:after{content:"✝";position:absolute;z-index:-1;right:18px;bottom:-26px;font:160px/1 Georgia,serif;color:#ffffff0b;pointer-events:none}
.hero h2{font-size:clamp(29px,7vw,38px);line-height:1.13;letter-spacing:-.025em;color:#fff;max-width:95%;margin:0;text-wrap:balance}
.vc{
  position:relative;background:var(--card);border:1px solid var(--ln);border-left:5px solid var(--gd);
  border-radius:19px;padding:23px 20px 19px;margin:0 0 22px;
  box-shadow:0 6px 20px #17243a0a;
}
.vt{font-size:clamp(19px,4.6vw,22px);line-height:1.55;letter-spacing:-.01em;margin:0 0 17px;color:var(--ink)}
.vr{font-weight:750;font-size:15px;color:var(--ac)}
.vc small{font-size:12px;margin-top:4px}
.ph{font-size:25px;line-height:1.2;margin:5px 0 12px}
.jp{margin:12px -16px 10px;padding:3px 16px 7px;gap:8px}
.jp button{padding:9px 15px;border-radius:999px;font-weight:600;box-shadow:0 2px 8px #17243a08}
.jp button:focus-visible{outline-offset:1px}
.cv{height:125px;border-radius:18px;background:linear-gradient(125deg,#1b2738,#2e435e)}
.pf{margin-top:-56px}
.avb{box-shadow:0 4px 14px #17243a18}
.st{overflow:hidden;box-shadow:0 3px 14px #17243a08}
.st div+div{border-left:1px solid var(--ln)}
.st b{font-size:22px;letter-spacing:-.02em}
.ab{gap:14px;padding:12px 0}
.ms,.gc{border-radius:17px;box-shadow:0 4px 14px #17243a08}
.gc{border-color:var(--ln)}
.gh{padding:13px 14px}
.gm{padding:12px}
.bb{border-radius:17px;padding:10px 13px;line-height:1.45}
.gb{padding:10px;border-top:1px solid var(--ln)}
.gb .nm{min-height:44px}
.snd{width:44px;height:44px;box-shadow:0 4px 10px color-mix(in srgb,var(--ac) 22%,transparent)}
.eye{border-radius:13px}
.hl{outline-color:var(--gd)}
#sp{background:linear-gradient(145deg,#182436 0%,#2b3d55 100%)}
#sp .cr i{background:#d8b66b}
#sp .spbar i{background:#d8b66b}
