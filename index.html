/* ===== Chapel In-Charge visual refresh (CSS-only; app logic preserved) ===== */
:root{
  --bg:#f4f6fa;
  --card:#ffffff;
  --ink:#202b3d;
  --mut:#68758a;
  --ln:#dfe5ee;
  --ok:#27794c;
  --gd:#c69a43;
  color-scheme:light;
}
:root[data-theme="dark"]{color-scheme:dark}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark}}
html{scroll-behavior:smooth;scrollbar-gutter:stable}
body{
  background:var(--bg);
  color:var(--ink);
  letter-spacing:.005em;
  -webkit-tap-highlight-color:transparent;
}
button,select,input,textarea{font:inherit}
button{transition:background-color .18s ease,border-color .18s ease,transform .18s ease,box-shadow .18s ease}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{
  outline:3px solid color-mix(in srgb,var(--gd) 72%,transparent);
  outline-offset:2px;
}
header{
  padding:13px 16px;
  gap:10px;
  background:linear-gradient(115deg,#1b2738 0%,#283a52 100%);
  border-bottom:2px solid var(--gd);
  box-shadow:0 5px 18px #11182720;
}
header h1{font-size:19px;letter-spacing:.01em;text-shadow:0 1px 2px #0002}
header>div{display:flex;align-items:center;gap:7px}
header select,header button{
  min-height:42px;
  border:1px solid #ffffff20;
  border-radius:13px;
  background:#ffffff16;
  padding:8px 11px;
  box-shadow:inset 0 1px #ffffff0a;
}
header select{max-width:105px}
header button{min-width:42px}
header button:active{transform:scale(.96)}
main{width:100%;max-width:760px;padding:18px 16px calc(112px + env(safe-area-inset-bottom,0px));}
section{margin:24px 0}
h2{font-size:19px;letter-spacing:-.015em;margin:0 0 10px}
section h2{display:flex;align-items:center;gap:9px}
section h2:before{content:"";display:inline-block;width:4px;height:19px;border-radius:5px;background:var(--gd);flex:none}
.nt,small{line-height:1.5}
.nt{margin:5px 0 10px}
.it{
  background:var(--card);
  border:1px solid var(--ln);
  border-radius:16px;
  margin:10px 0;
  padding:13px 14px;
  box-shadow:0 3px 12px #17243a08;
  transition:border-color .18s ease,box-shadow .18s ease,transform .18s ease;
}
.it:has(>label input:not(:disabled)){cursor:default}
.it>label{gap:12px;align-items:flex-start}
.it>label b{font-weight:650;line-height:1.4}
.it>label small{margin-top:4px;line-height:1.55}
input[type=checkbox]{width:21px;height:21px;accent-color:var(--ac);border-radius:6px;cursor:pointer}
.tg{border-radius:999px;padding:3px 8px;font-weight:650;letter-spacing:.015em}
details{margin-top:9px}
summary{padding:4px 0;font-weight:650}
.sb{padding:5px 0;line-height:1.45}
.pb{height:9px;border-radius:999px;margin-top:12px;background:var(--ln)}
.pb i{border-radius:999px}
.dt{gap:12px;margin:12px 0 8px;padding:12px 8px;background:var(--card);border:1px solid var(--ln);border-radius:16px;box-shadow:0 3px 12px #17243a08}
.dt b{font-size:17px}
.dt button{width:42px;height:42px;border-radius:13px;font-weight:500;box-shadow:0 2px 4px #17243a0a}
.dt button:hover{border-color:var(--ac);background:var(--acs)}
.lk{border-radius:12px;text-decoration:none}
.lk:hover{background:var(--acs)}
.big{border:1px solid color-mix(in srgb,var(--ac) 12%,var(--ln));padding:14px;border-radius:15px}
.ctl{gap:9px;margin:12px 0}
.ctl select,.nm,textarea.nm,input[type=time],input[type=number],input[type=search],input[type=email],input[type=password],input[type=text]{
  min-height:44px;border:1px solid var(--ln);border-radius:12px;background:var(--card);color:var(--ink);padding:10px 12px;
}
textarea.nm{min-height:92px;resize:vertical}
.sw{gap:8px;font-size:14px}
.seg{gap:7px;margin:10px 0}
.seg button{min-height:42px;padding:9px 12px;border-radius:12px;font-weight:600;box-shadow:0 1px 2px #17243a06}
.seg .on{box-shadow:0 4px 10px color-mix(in srgb,var(--ac) 20%,transparent)}
.su{min-height:48px;gap:12px;padding:12px 14px;margin:8px 0;border-radius:14px;box-shadow:0 2px 8px #17243a08}
.su:hover{border-color:color-mix(in srgb,var(--ac) 45%,var(--ln));transform:translateY(-1px)}
.su:active,.pr:active{transform:scale(.985)}
.pl{padding:11px 10px;border-bottom:1px solid var(--ln);border-radius:8px;line-height:1.45}
.pl.now{outline:1px solid color-mix(in srgb,var(--ac) 18%,transparent)}
.pr{min-height:46px;padding:12px 16px;border-radius:13px;box-shadow:0 5px 12px color-mix(in srgb,var(--ac) 18%,transparent)}
.pr:hover{filter:brightness(1.04)}
.s0 b{color:var(--ok)}
nav{
  gap:4px;
  padding:8px 7px calc(7px + env(safe-area-inset-bottom,0px));
  background:color-mix(in srgb,var(--card) 92%,transparent);
  border-top:1px solid var(--ln);
  box-shadow:0 -8px 24px #14203512;
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  z-index:20;
}
nav button{
  min-width:0;min-height:53px;padding:7px 2px 6px;border:1px solid transparent;border-radius:13px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  font-size:11px;line-height:1.15;color:var(--mut);overflow-wrap:anywhere;
}
nav button span{font-size:19px;line-height:1.1}
nav button.on{background:var(--acs);color:var(--ac);font-weight:750;border-color:color-mix(in srgb,var(--ac) 10%,transparent)}
nav button.nd:after{top:3px;left:calc(50% + 8px)}
.hero{
  position:relative;isolation:isolate;overflow:hidden;
  border:1px solid #ffffff12;
  border-radius:24px;
  padding:35px 24px 32px;
  margin:7px 0 16px;
  min-height:170px;
  display:flex;align-items:center;
  background:radial-gradient(circle at 92% 10%,#d4b36b24 0,transparent 34%),linear-gradient(135deg,#1a2638 0%,#2b3d55 100%);
  box-shadow:0 12px 28px #19273b20;
}
.hero:after{content:"✝";position:absolute;z-index:-1;right:18px;bottom:-26px;font:160px/1 Georgia,serif;color:#ffffff0b;pointer-events:none}
.hero h2{font-size:clamp(29px,7vw,38px);line-height:1.13;letter-spacing:-.025em;color:#fff;max-width:95%;margin:0;text-wrap:balance}
.vc{
  position:relative;background:var(--card);border:1px solid var(--ln);border-left:5px solid var(--gd);
  border-radius:19px;padding:23px 20px 19px;margin:0 0 22px;
  box-shadow:0 6px 20px #17243a0a;
}
.vt{font-size:clamp(19px,4.6vw,22px);line-height:1.55;letter-spacing:-.01em;margin:0 0 17px;color:var(--ink)}
.vr{font-weight:750;font-size:15px;color:var(--ac)}
.vc small{font-size:12px;margin-top:4px}
.ph{font-size:25px;line-height:1.2;margin:5px 0 12px}
.jp{margin:12px -16px 10px;padding:3px 16px 7px;gap:8px}
.jp button{padding:9px 15px;border-radius:999px;font-weight:600;box-shadow:0 2px 8px #17243a08}
.jp button:focus-visible{outline-offset:1px}
.cv{height:125px;border-radius:18px;background:linear-gradient(125deg,#1b2738,#2e435e)}
.pf{margin-top:-56px}
.avb{box-shadow:0 4px 14px #17243a18}
.st{overflow:hidden;box-shadow:0 3px 14px #17243a08}
.st div+div{border-left:1px solid var(--ln)}
.st b{font-size:22px;letter-spacing:-.02em}
.ab{gap:14px;padding:12px 0}
.ms,.gc{border-radius:17px;box-shadow:0 4px 14px #17243a08}
.gc{border-color:var(--ln)}
.gh{padding:13px 14px}
.gm{padding:12px}
.bb{border-radius:17px;padding:10px 13px;line-height:1.45}
.gb{padding:10px;border-top:1px solid var(--ln)}
.gb .nm{min-height:44px}
.snd{width:44px;height:44px;box-shadow:0 4px 10px color-mix(in srgb,var(--ac) 22%,transparent)}
.eye{border-radius:13px}
.hl{outline-color:var(--gd)}
#sp{background:linear-gradient(145deg,#182436 0%,#2b3d55 100%)}
#sp .cr i{background:#d8b66b}
#sp .spbar i{background:#d8b66b}

n the Baptist, to the holy Apostles Peter and Paul, to all the Saints, that I have sinned exceedingly in thought, word and deed, through my fault, through my fault, through my most grievous fault. Therefore I beseech blessed Mary ever Virgin, blessed Michael the Archangel, blessed John the Baptist, the holy Apostles Peter and Paul, and all the Saints, to pray to the Lord our God for me.",null],["Apostles' Creed","I believe in God, the Father almighty, Creator of heaven and earth, and in Jesus Christ, his only Son, our Lord, who was conceived by the Holy Spirit, born of the Virgin Mary, suffered under Pontius Pilate, was crucified, died, and was buried. He descended into hell; on the third day he rose again from the dead; he ascended into heaven, and is seated at the right hand of God the Father almighty; from there he will come to judge the living and the dead.\nI believe in the Holy Spirit, the holy catholic Church, the communion of saints, the forgiveness of sins, the resurrection of the body, and life everlasting. Amen.","Credo in Deum Patrem omnipotentem, Creatorem caeli et terrae, et in Iesum Christum, Filium eius unicum, Dominum nostrum, qui conceptus est de Spiritu Sancto, natus ex Maria Virgine, passus sub Pontio Pilato, crucifixus, mortuus, et sepultus, descendit ad inferos, tertia die resurrexit a mortuis, ascendit ad caelos, sedet ad dexteram Dei Patris omnipotentis, inde venturus est iudicare vivos et mortuos.\nCredo in Spiritum Sanctum, sanctam Ecclesiam catholicam, sanctorum communionem, remissionem peccatorum, carnis resurrectionem, vitam aeternam. Amen."],["Nicene Creed","I believe in one God, the Father almighty, maker of heaven and earth, of all things visible and invisible.\nAnd in one Lord Jesus Christ, the only-begotten Son of God, born of the Father before all ages. God of God, light of light, true God of true God. Begotten, not made, being of one substance with the Father; by whom all things were made. Who for us men and for our salvation came down from heaven. And was incarnate by the Holy Spirit of the Virgin Mary, and was made man. He was also crucified for us, suffered under Pontius Pilate, and was buried. And on the third day he rose again according to the Scriptures. And ascended into heaven, and sits at the right hand of the Father. And he shall come again with glory to judge the living and the dead; of whose kingdom there shall be no end.\nAnd in the Holy Spirit, the Lord and giver of life, who proceeds from the Father and the Son. Who together with the Father and the Son is adored and glorified; who spoke by the prophets.\nAnd one holy catholic and apostolic Church. I confess one baptism for the remission of sins. And I look for the resurrection of the dead, and the life of the world to come. Amen.",null],["Angel of God","Angel of God, my guardian dear,\nto whom God's love commits me here,\never this day be at my side,\nto light and guard, to rule and guide. Amen.","Angele Dei, qui custos es mei,\nme tibi commissum pietate superna;\nillumina, custodi, rege, et guberna. Amen."]],"m":""},{"p":[["Act of Faith","O my God, I firmly believe that you are one God in three divine Persons, Father, Son and Holy Spirit. I believe that your divine Son became man and died for our sins, and that he will come to judge the living and the dead. I believe these and all the truths which the holy Catholic Church teaches, because you have revealed them, who can neither deceive nor be deceived.",null],["Act of Hope","O my God, relying on your almighty power and your infinite mercy and promises, I hope to gain pardon for my sins, the help of your grace, and life everlasting, through the merits of Jesus Christ, our Lord and Redeemer.",null],["Act of Love","O my God, I love you above all things, with my whole heart and soul, because you are all good and worthy of all my love. I love my neighbor as myself for the love of you. I forgive all who have injured me, and I ask pardon of all whom I have injured.",null],["Angelic Trisagion","Holy God, Holy Mighty One, Holy Immortal One, have mercy on us.","Sanctus Deus, Sanctus Fortis, Sanctus Immortalis, miserere nobis."]],"m":"Athanasian Creed and Te Deum"},{"p":[["Act of Spiritual Communion","I believe, Jesus, that you are really present in the Most Blessed Sacrament. I love you above all things, and I desire to receive you into my soul. Since I cannot now receive you sacramentally, come at least spiritually into my heart. I embrace you as if you were already there, and unite myself wholly to you. Never permit me to be separated from you.",null],["Divine Praises","Blessed be God.\nBlessed be his holy Name.\nBlessed be Jesus Christ, true God and true man.\nBlessed be the name of Jesus.\nBlessed be his most Sacred Heart.\nBlessed be his most Precious Blood.\nBlessed be Jesus in the most holy Sacrament of the Altar.\nBlessed be the Holy Spirit, the Paraclete.\nBlessed be the great Mother of God, Mary most holy.\nBlessed be her holy and Immaculate Conception.\nBlessed be her glorious Assumption.\nBlessed be the name of Mary, Virgin and Mother.\nBlessed be Saint Joseph, her most chaste spouse.\nBlessed be God in his Angels and in his Saints.",null],["Tantum ergo","Therefore we, before him bending,\nthis great Sacrament revere;\ntypes and shadows have their ending,\nfor the newer rite is here;\nfaith, our outward sense befriending,\nmakes the inward vision clear.\n\nGlory let us give, and blessing\nto the Father and the Son;\nhonor, might, and praise addressing,\nwhile eternal ages run;\never too his love confessing,\nwho, from both, with both is one. Amen.","Tantum ergo Sacramentum\nveneremur cernui:\net antiquum documentum\nnovo cedat ritui:\npraestet fides supplementum\nsensuum defectui.\n\nGenitori, Genitoque\nlaus et iubilatio,\nsalus, honor, virtus quoque\nsit et benedictio:\nprocedenti ab utroque\ncompar sit laudatio. Amen."]],"m":"Visit to the Blessed Sacrament, Adoro te devote, Pange lingua, Sacris solemniis, Lauda Sion, Iesu dulcis memoria and Verbum supernum"},{"p":[["Come, Holy Spirit","Come, Holy Spirit, fill the hearts of your faithful and kindle in them the fire of your love.\nV. Send forth your Spirit and they shall be created.\nR. And you will renew the face of the earth.\nLet us pray. O God, who by the light of the Holy Spirit instructed the hearts of the faithful, grant that by the same Holy Spirit we may be truly wise and ever enjoy his consolations. Through Christ our Lord. Amen.","Veni, Sancte Spiritus, reple tuorum corda fidelium, et tui amoris in eis ignem accende.\nV. Emitte Spiritum tuum et creabuntur.\nR. Et renovabis faciem terrae.\nOremus. Deus, qui corda fidelium Sancti Spiritus illustratione docuisti, da nobis in eodem Spiritu recta sapere, et de eius semper consolatione gaudere. Per Christum Dominum nostrum. Amen."],["Prayer to the Holy Spirit","O Holy Spirit, beloved of my soul, I adore you. Enlighten me, guide me, strengthen me, console me. Tell me what I should do; give me your orders. I promise to submit myself to all that you desire of me and to accept all that you permit to happen to me. Let me only know your will.",null]],"m":"Veni, Creator and Veni, Sancte Spiritus"},{"p":[["Angelus","V. The Angel of the Lord declared unto Mary.\nR. And she conceived of the Holy Spirit.\nHail Mary...\nV. Behold the handmaid of the Lord.\nR. Be it done unto me according to your word.\nHail Mary...\nV. And the Word was made flesh.\nR. And dwelt among us.\nHail Mary...\nV. Pray for us, O holy Mother of God.\nR. That we may be made worthy of the promises of Christ.\n\nLet us pray. Pour forth, we beseech you, O Lord, your grace into our hearts, that we, to whom the incarnation of Christ your Son was made known by the message of an angel, may by his passion and cross be brought to the glory of his resurrection. Through the same Christ our Lord. Amen.","V. Angelus Domini nuntiavit Mariae.\nR. Et concepit de Spiritu Sancto.\nAve Maria...\nV. Ecce ancilla Domini.\nR. Fiat mihi secundum verbum tuum.\nAve Maria...\nV. Et Verbum caro factum est.\nR. Et habitavit in nobis.\nAve Maria...\nV. Ora pro nobis, sancta Dei Genetrix.\nR. Ut digni efficiamur promissionibus Christi.\n\nOremus. Gratiam tuam, quaesumus, Domine, mentibus nostris infunde; ut qui, Angelo nuntiante, Christi Filii tui incarnationem cognovimus, per passionem eius et crucem ad resurrectionis gloriam perducamur. Per eundem Christum Dominum nostrum. Amen."],["Regina caeli","Queen of heaven, rejoice, alleluia.\nFor he whom you did merit to bear, alleluia,\nhas risen as he said, alleluia.\nPray for us to God, alleluia.\nV. Rejoice and be glad, O Virgin Mary, alleluia.\nR. For the Lord has truly risen, alleluia.\n\nLet us pray. O God, who gave joy to the world through the resurrection of your Son, our Lord Jesus Christ, grant, we beseech you, that through the intercession of the Virgin Mary, his Mother, we may obtain the joys of everlasting life. Through the same Christ our Lord. Amen.","Regina caeli, laetare, alleluia:\nquia quem meruisti portare, alleluia,\nresurrexit, sicut dixit, alleluia:\nora pro nobis Deum, alleluia.\nV. Gaude et laetare, Virgo Maria, alleluia.\nR. Quia surrexit Dominus vere, alleluia.\n\nOremus. Deus, qui per resurrectionem Filii tui, Domini nostri Iesu Christi, mundum laetificare dignatus es: praesta, quaesumus; ut per eius Genetricem Virginem Mariam, perpetuae capiamus gaudia vitae. Per eundem Christum Dominum nostrum. Amen."],["Memorare","Remember, O most gracious Virgin Mary, that never was it known that anyone who fled to your protection, implored your help, or sought your intercession was left unaided. Inspired by this confidence, I fly unto you, O Virgin of virgins, my Mother; to you I come, before you I stand, sinful and sorrowful. O Mother of the Word Incarnate, despise not my petitions, but in your mercy hear and answer me. Amen.","Memorare, o piissima Virgo Maria, non esse auditum a saeculo, quemquam ad tua currentem praesidia, tua implorantem auxilia, tua petentem suffragia, esse derelictum. Ego tali animatus confidentia, ad te, Virgo Virginum, Mater, curro, ad te venio, coram te gemens peccator assisto. Noli, Mater Verbi, verba mea despicere; sed audi propitia et exaudi. Amen."],["Holy Rosary","Begin with the Sign of the Cross, the Apostles' Creed, one Our Father, three Hail Marys and a Glory Be.\nThen for each of the five mysteries: name the mystery, and pray one Our Father, ten Hail Marys and a Glory Be.\nEnd with the Hail, Holy Queen.\n\nJoyful (Monday and Saturday)\n1. The Annunciation\n2. The Visitation\n3. The Nativity\n4. The Presentation in the Temple\n5. The Finding of the Child Jesus in the Temple\n\nLuminous (Thursday)\n1. The Baptism of Jesus in the Jordan\n2. The Wedding at Cana\n3. The Proclamation of the Kingdom of God\n4. The Transfiguration\n5. The Institution of the Eucharist\n\nSorrowful (Tuesday and Friday)\n1. The Agony in the Garden\n2. The Scourging at the Pillar\n3. The Crowning with Thorns\n4. The Carrying of the Cross\n5. The Crucifixion and Death of Jesus\n\nGlorious (Wednesday and Sunday)\n1. The Resurrection\n2. The Ascension\n3. The Descent of the Holy Spirit\n4. The Assumption of Mary\n5. The Coronation of Mary as Queen of Heaven",null],["We Fly to Your Protection","We fly to your patronage, O holy Mother of God; despise not our petitions in our necessities, but deliver us always from all dangers, O glorious and blessed Virgin.","Sub tuum praesidium confugimus, Sancta Dei Genetrix; nostras deprecationes ne despicias in necessitatibus, sed a periculis cunctis libera nos semper, Virgo gloriosa et benedicta."],["Magnificat","My soul doth magnify the Lord.\nAnd my spirit hath rejoiced in God my Saviour.\nBecause he hath regarded the humility of his handmaid; for behold from henceforth all generations shall call me blessed.\nBecause he that is mighty hath done great things to me; and holy is his name.\nAnd his mercy is from generation unto generations, to them that fear him.\nHe hath shewed might in his arm: he hath scattered the proud in the conceit of their heart.\nHe hath put down the mighty from their seat, and hath exalted the humble.\nHe hath filled the hungry with good things; and the rich he hath sent empty away.\nHe hath received Israel his servant, being mindful of his mercy.\nAs he spoke to our fathers, to Abraham and to his seed for ever.","Magnificat anima mea Dominum;\net exsultavit spiritus meus in Deo salutari meo,\nquia respexit humilitatem ancillae suae.\nEcce enim ex hoc beatam me dicent omnes generationes,\nquia fecit mihi magna qui potens est, et sanctum nomen eius,\net misericordia eius in progenies et progenies timentibus eum.\nFecit potentiam in bracchio suo, dispersit superbos mente cordis sui;\ndeposuit potentes de sede et exaltavit humiles;\nesurientes implevit bonis et divites dimisit inanes.\nSuscepit Israel puerum suum, recordatus misericordiae suae,\nsicut locutus est ad patres nostros, Abraham et semini eius in saecula."],["Hail, Holy Queen","Hail, holy Queen, Mother of mercy, our life, our sweetness and our hope. To you do we cry, poor banished children of Eve; to you do we send up our sighs, mourning and weeping in this valley of tears. Turn then, most gracious advocate, your eyes of mercy toward us; and after this our exile, show unto us the blessed fruit of your womb, Jesus. O clement, O loving, O sweet Virgin Mary.\nV. Pray for us, O holy Mother of God.\nR. That we may be made worthy of the promises of Christ.","Salve, Regina, Mater misericordiae, vita, dulcedo, et spes nostra, salve. Ad te clamamus, exsules filii Hevae. Ad te suspiramus, gementes et flentes in hac lacrimarum valle. Eia ergo, advocata nostra, illos tuos misericordes oculos ad nos converte. Et Iesum, benedictum fructum ventris tui, nobis post hoc exsilium ostende. O clemens, O pia, O dulcis Virgo Maria.\nV. Ora pro nobis, sancta Dei Genetrix.\nR. Ut digni efficiamur promissionibus Christi."]],"m":"Stabat Mater, Blessed Be Your Purity, Alma Redemptoris Mater and Ave Regina Caelorum"},{"p":[["Prayer of St. Thomas Aquinas","Almighty and everlasting God, behold, I come to the sacrament of your only-begotten Son, our Lord Jesus Christ. As one infirm I come to the physician of life; unclean, to the fountain of mercy; blind, to the light of eternal brightness; poor and needy, to the Lord of heaven and earth.\nTherefore I implore the abundance of your measureless bounty, that you would graciously vouchsafe to heal my infirmity, wash my defilement, enlighten my blindness, enrich my poverty, and clothe my nakedness; that so I may receive the Bread of Angels, the King of kings and Lord of lords, with such reverence and humility, such contrition and devotion, such purity and faith, such purpose and intention, as may be profitable to the salvation of my soul.\nGrant me, I pray, to receive not only the sacrament of the Lord's Body and Blood, but also the grace and power of the sacrament. O most gracious God, grant me so to receive the Body of your only-begotten Son, our Lord Jesus Christ, which he took from the Virgin Mary, as to be incorporated into his mystical body and numbered among his members.\nO most loving Father, grant that I may behold forever face to face your beloved Son, whom now, on my pilgrim way, I am about to receive under the sacramental veil: who with you and the Holy Spirit lives and reigns, world without end. Amen.",null],["Prayer to St. Joseph","To you, O blessed Joseph, we come in our tribulation, and having implored the help of your most holy Spouse, we confidently invoke your patronage also. Through that charity which bound you to the Immaculate Virgin Mother of God, and through the paternal love with which you embraced the Child Jesus, we humbly beg you graciously to regard the inheritance which Jesus Christ has purchased by his Blood, and with your power and strength to aid us in our necessities.\nO most watchful guardian of the Holy Family, defend the chosen children of Jesus Christ; O most loving father, ward off from us every contagion of error and corrupting influence; O our most mighty protector, be kind to us and from heaven assist us in our struggle with the power of darkness.\nAs once you rescued the Child Jesus from deadly peril, so now protect God's Holy Church from the snares of the enemy and from all adversity; shield, too, each one of us by your constant protection, so that, supported by your example and your aid, we may be able to live piously, to die in holiness, and to obtain eternal happiness in heaven. Amen.",null],["Before Communion","Lord, I am not worthy that you should enter under my roof, but only say the word and my soul shall be healed.","Domine, non sum dignus ut intres sub tectum meum: sed tantum dic verbo, et sanabitur anima mea."]],"m":"Prayer to the Blessed Virgin Mary and Prayer of St. Ambrose"},{"p":[["Prayer to St. Michael","Saint Michael the Archangel, defend us in battle. Be our protection against the wickedness and snares of the devil. May God rebuke him, we humbly pray; and do thou, O Prince of the heavenly host, by the power of God, thrust into hell Satan and all the evil spirits who prowl about the world seeking the ruin of souls. Amen.","Sancte Michael Archangele, defende nos in proelio; contra nequitiam et insidias diaboli esto praesidium. Imperet illi Deus, supplices deprecamur: tuque, Princeps militiae caelestis, Satanam aliosque spiritus malignos, qui ad perditionem animarum pervagantur in mundo, divina virtute in infernum detrude. Amen."],["Anima Christi","Soul of Christ, sanctify me.\nBody of Christ, save me.\nBlood of Christ, inebriate me.\nWater from the side of Christ, wash me.\nPassion of Christ, strengthen me.\nO good Jesus, hear me.\nWithin your wounds hide me.\nPermit me not to be separated from you.\nFrom the malicious enemy defend me.\nIn the hour of my death call me,\nand bid me come to you,\nthat with your saints I may praise you\nforever and ever. Amen.","Anima Christi, sanctifica me.\nCorpus Christi, salva me.\nSanguis Christi, inebria me.\nAqua lateris Christi, lava me.\nPassio Christi, conforta me.\nO bone Iesu, exaudi me.\nIntra tua vulnera absconde me.\nNe permittas me separari a te.\nAb hoste maligno defende me.\nIn hora mortis meae voca me.\nEt iube me venire ad te,\nut cum Sanctis tuis laudem te\nin saecula saeculorum. Amen."],["To Jesus Christ Crucified","Behold, O kind and most sweet Jesus, I cast myself upon my knees in your sight, and with the most fervent desire of my soul I pray and beseech you that you would impress upon my heart lively sentiments of faith, hope and charity, with true repentance for my sins and a firm desire of amendment, while with deep affection and grief of soul I ponder within myself and mentally contemplate your five most precious wounds, having before my eyes that which David the prophet said of you, O good Jesus: \"They have pierced my hands and my feet; they have numbered all my bones.\"",null]],"m":"Prayer of St. Thomas Aquinas, Prayer of St. Bonaventure, Universal Prayer, Prayer to the Blessed Virgin Mary, Prayer to St. Joseph and the Canticle of the Three Children"},{"p":[["Psalm 2","Why have the Gentiles raged, and the people devised vain things?\nThe kings of the earth stood up, and the princes met together, against the Lord and against his Christ.\nLet us break their bonds asunder: and let us cast away their yoke from us.\nHe that dwelleth in heaven shall laugh at them: and the Lord shall deride them.\nThen shall he speak to them in his anger, and trouble them in his rage.\nBut I am appointed king by him over Sion his holy mountain, preaching his commandment.\nThe Lord hath said to me: Thou art my son, this day have I begotten thee.\nAsk of me, and I will give thee the Gentiles for thy inheritance, and the utmost parts of the earth for thy possession.\nThou shalt rule them with a rod of iron, and shalt break them in pieces like a potter's vessel.\nAnd now, O ye kings, understand: receive instruction, you that judge the earth.\nServe ye the Lord with fear: and rejoice unto him with trembling.\nEmbrace discipline, lest at any time the Lord be angry, and you perish from the just way.\nWhen his wrath shall be kindled in a short time, blessed are all they that trust in him.",null],["Psalm 50 (Miserere)","Have mercy on me, O God, according to thy great mercy.\nAnd according to the multitude of thy tender mercies blot out my iniquity.\nWash me yet more from my iniquity, and cleanse me from my sin.\nFor I know my iniquity, and my sin is always before me.\nTo thee only have I sinned, and have done evil before thee: that thou mayst be justified in thy words, and mayst overcome when thou art judged.\nFor behold I was conceived in iniquities; and in sins did my mother conceive me.\nFor behold thou hast loved truth: the uncertain and hidden things of thy wisdom thou hast made manifest to me.\nThou shalt sprinkle me with hyssop, and I shall be cleansed: thou shalt wash me, and I shall be made whiter than snow.\nTo my hearing thou shalt give joy and gladness: and the bones that have been humbled shall rejoice.\nTurn away thy face from my sins, and blot out all my iniquities.\nCreate a clean heart in me, O God: and renew a right spirit within my bowels.\nCast me not away from thy face; and take not thy holy spirit from me.\nRestore unto me the joy of thy salvation, and strengthen me with a perfect spirit.\nI will teach the unjust thy ways: and the wicked shall be converted to thee.\nDeliver me from blood, O God, thou God of my salvation: and my tongue shall extol thy justice.\nO Lord, thou wilt open my lips: and my mouth shall declare thy praise.\nFor if thou hadst desired sacrifice, I would indeed have given it: with burnt offerings thou wilt not be delighted.\nA sacrifice to God is an afflicted spirit: a contrite and humbled heart, O God, thou wilt not despise.\nDeal favourably, O Lord, in thy good will with Sion; that the walls of Jerusalem may be built up.\nThen shalt thou accept the sacrifice of justice, oblations and whole burnt offerings: then shall they lay calves upon thy altar.",null],["Grace Before Meals","Bless us, O Lord, and these your gifts, which we are about to receive from your bounty, through Christ our Lord. Amen.","Benedic, Domine, nos et haec tua dona, quae de tua largitate sumus sumpturi. Per Christum Dominum nostrum. Amen."],["Grace After Meals","We give you thanks, almighty God, for all your benefits, who live and reign forever. Amen.\nMay the souls of the faithful departed, through the mercy of God, rest in peace. Amen.","Agimus tibi gratias, omnipotens Deus, pro universis beneficiis tuis, qui vivis et regnas in saecula saeculorum. Amen.\nFidelium animae per misericordiam Dei requiescant in pace. Amen."]],"m":"O Good Cross, Way of the Cross, Mental Prayer, Spiritual Reading, Blessing for a Journey and Preces"},{"p":[["Ubi caritas","Where charity and love are, God is there.\nThe love of Christ has gathered us into one.\nLet us rejoice and be glad in him.\nLet us fear and love the living God,\nand love one another from a sincere heart.","Ubi caritas et amor, Deus ibi est.\nCongregavit nos in unum Christi amor.\nExsultemus, et in ipso iucundemur.\nTimeamus, et amemus Deum vivum.\nEt ex corde diligamus nos sincero."],["Ave verum corpus","Hail, true Body, born of the Virgin Mary,\nwho truly suffered and was sacrificed on the cross for mankind;\nfrom whose pierced side flowed water and blood:\nbe for us a foretaste of heaven in the trial of death.\nO sweet Jesus, O kind Jesus, O Jesus, Son of Mary,\nhave mercy on me. Amen.","Ave, verum corpus natum de Maria Virgine:\nvere passum, immolatum in cruce pro homine:\ncuius latus perforatum unda fluxit et sanguine:\nesto nobis praegustatum in mortis examine.\nO Iesu dulcis, O Iesu pie, O Iesu fili Mariae.\nMiserere mei. Amen."],["Ave maris stella","Hail, star of the sea, loving Mother of God, and ever Virgin, happy gate of heaven.\nReceiving that Ave from the mouth of Gabriel, establish us in peace, changing the name of Eve.\nLoosen the chains of the guilty, bring light to the blind, drive away our evils, and ask for all good things.\nShow yourself a Mother: may he who was born for us and chose to be yours receive our prayers through you.\nVirgin without equal, gentle above all, make us, freed from our sins, gentle and chaste.\nGrant us a pure life, make safe our way, that seeing Jesus we may rejoice together forever.\nPraise be to God the Father, glory to Christ the Most High, and to the Holy Spirit; one honor to the three. Amen.","Ave maris stella,\nDei Mater alma,\natque semper Virgo,\nfelix caeli porta.\n\nSumens illud Ave\nGabrielis ore,\nfunda nos in pace,\nmutans Evae nomen.\n\nSolve vincla reis,\nprofer lumen caecis,\nmala nostra pelle,\nbona cuncta posce.\n\nMonstra te esse matrem,\nsumat per te preces,\nqui pro nobis natus\ntulit esse tuus.\n\nVirgo singularis,\ninter omnes mitis,\nnos culpis solutos\nmites fac et castos.\n\nVitam praesta puram,\niter para tutum,\nut videntes Iesum\nsemper collaetemur.\n\nSit laus Deo Patri,\nsummo Christo decus,\nSpiritui Sancto,\ntribus honor unus. Amen."],["Oremus pro Pontifice","V. Let us pray for our Pope.\nR. The Lord preserve him, give him life, make him blessed on earth, and not hand him over to the will of his enemies.","V. Oremus pro Pontifice nostro.\nR. Dominus conservet eum, et vivificet eum, et beatum faciat eum in terra, et non tradat eum in animam inimicorum eius."]],"m":"Pax in caelo, Rorate caeli, Te Ioseph, Media vita, Song of Zechariah, Lux aeterna and Vexilla Regis"},{"p":[["Eternal Rest","Eternal rest grant unto them, O Lord, and let perpetual light shine upon them. May they rest in peace. Amen.","Requiem aeternam dona eis, Domine, et lux perpetua luceat eis. Requiescant in pace. Amen."],["For a Parent","O God, who commanded us to honor father and mother, in your mercy have pity on the soul of my father (mother), and forgive his (her) sins; and grant that I may see him (her) again in the joy of everlasting brightness. Through Christ our Lord. Amen.","Deus, qui nos patrem et matrem honorare praecepisti: miserere clementer animae patris (matris) meae, eiusque peccata dimitte, meque eum (eam) in aeternae claritatis gaudio fac videre. Per Christum Dominum nostrum. Amen."],["For All the Faithful Departed","O God, the Creator and Redeemer of all the faithful, grant to the souls of your servants and handmaids departed the remission of all their sins, that through our devout prayers they may obtain the pardon which they have always desired. Who live and reign with God the Father in the unity of the Holy Spirit, one God, forever and ever. Amen.","Fidelium, Deus, omnium Conditor et Redemptor, animabus famulorum famularumque tuarum remissionem cunctorum tribue peccatorum: ut indulgentiam, quam semper optaverunt, piis supplicationibus consequantur. Qui vivis et regnas in saecula saeculorum. Amen."]],"m":"Responsory"},{"p":[["The Double Commandment of Love (Mt 22:37-40)","Thou shalt love the Lord thy God with thy whole heart, and with thy whole soul, and with thy whole mind. This is the greatest and the first commandment. And the second is like to this: Thou shalt love thy neighbour as thyself. On these two commandments dependeth the whole law and the prophets.",null],["The Golden Rule (Mt 7:12)","All things therefore whatsoever you would that men should do to you, do you also to them. For this is the law and the prophets.",null],["The Ten Commandments","1. I am the Lord your God: you shall not have strange gods before me.\n2. You shall not take the name of the Lord your God in vain.\n3. Remember to keep holy the Lord's Day.\n4. Honor your father and your mother.\n5. You shall not kill.\n6. You shall not commit adultery.\n7. You shall not steal.\n8. You shall not bear false witness against your neighbor.\n9. You shall not covet your neighbor's wife.\n10. You shall not covet your neighbor's goods.",null],["The Beatitudes (Mt 5:3-12)","Blessed are the poor in spirit: for theirs is the kingdom of heaven.\nBlessed are the meek: for they shall possess the land.\nBlessed are they that mourn: for they shall be comforted.\nBlessed are they that hunger and thirst after justice: for they shall have their fill.\nBlessed are the merciful: for they shall obtain mercy.\nBlessed are the clean of heart: for they shall see God.\nBlessed are the peacemakers: for they shall be called the children of God.\nBlessed are they that suffer persecution for justice' sake: for theirs is the kingdom of heaven.\nBlessed are ye when they shall revile you, and persecute you, and speak all that is evil against you, untruly, for my sake: be glad and rejoice, for your reward is very great in heaven.",null],["The Three Theological Virtues","Faith\nHope\nCharity",null],["The Four Cardinal Virtues","Prudence\nJustice\nFortitude\nTemperance",null],["The Seven Gifts of the Holy Spirit","Wisdom\nUnderstanding\nCounsel\nFortitude\nKnowledge\nPiety\nFear of the Lord",null],["The Twelve Fruits of the Holy Spirit (Gal 5:22-23)","Charity\nJoy\nPeace\nPatience\nKindness\nGoodness\nGenerosity\nGentleness\nFaithfulness\nModesty\nSelf-control\nChastity",null],["The Five Precepts of the Church","1. Attend Mass on Sundays and holy days of obligation, and rest from servile work.\n2. Confess your sins at least once a year.\n3. Receive Holy Communion at least during the Easter season.\n4. Observe the days of fasting and abstinence established by the Church.\n5. Help to provide for the needs of the Church.",null],["The Seven Corporal Works of Mercy","1. Feed the hungry.\n2. Give drink to the thirsty.\n3. Clothe the naked.\n4. Shelter the homeless.\n5. Visit the sick.\n6. Visit the imprisoned.\n7. Bury the dead.",null],["The Seven Spiritual Works of Mercy","1. Counsel the doubtful.\n2. Instruct the ignorant.\n3. Admonish sinners.\n4. Comfort the afflicted.\n5. Forgive offenses.\n6. Bear wrongs patiently.\n7. Pray for the living and the dead.",null],["The Seven Deadly Sins","Pride\nCovetousness (greed)\nLust\nAnger\nGluttony\nEnvy\nSloth",null],["The Last Things","Death\nJudgment\nHeaven\nHell",null]],"m":""},{"p":[["Peace Prayer of St. Francis","Lord, make me an instrument of your peace;\nwhere there is hatred, let me sow love;\nwhere there is injury, pardon;\nwhere there is doubt, faith;\nwhere there is despair, hope;\nwhere there is darkness, light;\nand where there is sadness, joy.\n\nO Divine Master, grant that I may not so much seek\nto be consoled as to console;\nto be understood as to understand;\nto be loved as to love.\nFor it is in giving that we receive;\nit is in pardoning that we are pardoned;\nand it is in dying that we are born to eternal life. Amen.",null],["Suscipe of St. Ignatius","Take, Lord, and receive all my liberty, my memory, my understanding and my entire will, all that I have and possess. You have given all to me; to you, Lord, I return it. All is yours; dispose of it wholly according to your will. Give me only your love and your grace, for this is enough for me.",null],["Bookmark of St. Teresa of Avila","Let nothing disturb you,\nnothing frighten you.\nAll things are passing;\nGod never changes.\nPatience obtains all things.\nWhoever has God lacks nothing.\nGod alone suffices.",null]],"m":"the prayer cards of Saint Josemaria, the blessed and the servants of God"}];

/* ---- Users Status and Users Data: how each user is doing with their tasks (priest and founder only) ---- */
let UD={k:'',t:0,rows:[],busy:false,err:''},UDU='',UB='home',NL=null;
const isLd=()=>!!(SB&&ME&&isLead());
const isLU=u=>RLS(u).some(r=>r=='priest'||r=='founder');
async function udLoad(){if(!sbOK()||!isLead()||UD.busy)return;UD.busy=true;const c0=S.ch,d=new Date();d.setDate(d.getDate()-29);const from=ymd(d),rows=[];let err='';
try{for(let i=0;i<8;i++){const {data,error}=await sb.from('task_done').select('*').eq('chapel',c0).gte('day',from).order('day',{ascending:false}).range(i*1000,i*1000+999);if(error)throw error;rows.push(...(data||[]));if(!data||data.length<1000)break}}catch(e){err=(e&&e.message)||'Something went wrong.'}
if(!err)UD.rows=rows;UD.err=err;UD.k=c0;UD.t=Date.now();UD.busy=false;if(S.tab=='ustat'||S.tab=='udata')R()}
const tcat=id=>/^d\d+$/.test(id)?'Daily cleaning':id=='w'?'Weekly task':/^mo\d+$/.test(id)?'Monthly task':/^c\d+$/.test(id)?'Closing':'Mass preparation';
const UCATS=['Daily cleaning','Weekly task','Monthly task','Closing','Mass preparation'];
function tname(id,day){const d=new Date(day+'T00:00'),w=d.getDay(),n=Math.ceil(d.getDate()/7);
if(/^d\d+$/.test(id))return (DAILY[+id.slice(1)]||[id])[0];
if(id=='w')return (WEEK[w]||['Weekly task'])[0];
if(/^mo\d+$/.test(id)){const m=MON.filter(x=>x.wd==w&&x.n==n)[+id.slice(2)];return m?m.t:'Monthly task'}
if(/^c\d+$/.test(id))return (CLOSE[+id.slice(1)]||[id])[0];
if(/^Pmass\d+$/.test(id)){const x=PM(false)[+id.slice(5)];return x?x.t:'Mass preparation'}
if(/^rb\d+$/.test(id))return RB[+id.slice(2)]||'Book preparation';
return id}
function udCalc(){const per=S.up||'7',n=per=='today'?1:+per,d0=new Date();d0.setDate(d0.getDate()-(n-1));const from=ymd(d0),td=ymd(new Date()),rows=UD.rows.filter(x=>x.day>=from),by={};
rows.forEach(x=>{const u=by[x.user_id]||(by[x.user_id]={id:x.user_id,done:0,days:new Set(),last:'',ht:0,cat:{},list:[]});u.done++;u.days.add(x.day);const t=x.created_at||x.day+'T12:00:00';if(x.created_at)u.ht=1;if(t>u.last)u.last=t;const c=tcat(x.task);u.cat[c]=(u.cat[c]||0)+1;u.list.push(x)});
return{n,from,td,rows,by,total:rows.length,days:new Set(rows.map(x=>x.day)).size}}
const udEmpty=id=>({id,done:0,days:new Set(),last:'',ht:0,cat:{},list:[]});
const udRoster=c=>{const ids=new Set(Object.keys(MEM).filter(i=>RLS(MEM[i]).some(r=>r=='crew'||r=='oratory')));Object.keys(c.by).forEach(i=>ids.add(i));
return [...ids].map(i=>({u:MEM[i]||{id:i,name:'Former member',username:''},s:c.by[i]||udEmpty(i)})).sort((a,b)=>b.s.done-a.s.done||(a.u.name||'').localeCompare(b.u.name||''))};
const udWhen=(s,per)=>s.ht?(per?tm(s.last):dl(s.last)+', '+tm(s.last)):dl(s.last);
function udToday(c){const sd=S.date;S.date=ymd(new Date());let ids=[];try{ids=tIds()}finally{S.date=sd}const set=new Set(c.rows.filter(x=>x.day==c.td).map(x=>x.task));return [ids.filter(i=>set.has(i)).length,ids.length]}
const perBar=()=>`<div class=seg>${[['today','Today'],['7','7 days'],['30','30 days']].map(([v,l])=>`<button data-up=${v} class="${(S.up||'7')==v?'on':''}">${l}</button>`).join('')}</div>`;
const udNo=()=>sec('Users','','<p class=nt>Only the priest and founder can see this.</p>');
const udState=()=>!sbOK()?'<p class=nt>Connect to the internet and sign in to see the user records.</p>':UD.k!=S.ch?'<p class=nt>Loading...</p>':UD.err?`<p class=er>Could not load the records: ${esc(UD.err)}</p><button class=lk data-udr=1>Try again</button>`:'';
function udRow(r,c){const {u,s}=r,per=(S.up||'7')=='today',sh=c.total?Math.round(100*s.done/c.total):0,cl=s.days.has(c.td)?' on':s.done?' am':'',
last=s.done?'Last: '+udWhen(s,per):'',meta=!s.done?(per?'No tasks yet today':'No tasks in this period'):(per?last:`${s.days.size} of ${c.n} days active &middot; ${last}`);
return `<button class=udu data-ud="${esc(u.id||s.id)}"><span class="dot${cl}">${av(u,42)}</span><span class=udm><b>${esc(u.name||u.username||'Unknown')}</b><small>${esc(RLS(u).map(k=>RS[k]).join(', ')||'No role yet')}</small><div class=pb><i style="width:${sh}%"></i></div><small>${meta}</small></span><span class=udn><b>${s.done}</b><small>${s.done==1?'task':'tasks'}</small></span></button>`}
function planCard(){const w=new Date(S.date+'T00:00').getDay(),p=PLAN[S.date]||{},wk=w==0||w==6,lang=wk?p.lang:LANGF[w];
return sec('Message to the crew','The language of the Mass and a note for the selected day.',dbar()+`<div class="it wide"><div class=lg><span>Language of the Mass</span><b>${lang||'Not set yet'}</b></div>`+(wk?`<div class=seg>${['English','Bisaya','Latin'].map(l=>`<button data-lg="${l}" class="${p.lang==l?'on':''}">${l}</button>`).join('')}</div>`:'')+`<textarea class=nm rows=3 id=pn placeholder="Write a note for the crew">${esc(p.note||'')}</textarea><button class=pr data-x=pnote>Save note</button></div>`)}
function ustat(){if(!isLd())return udNo();
let h='<h2 class=ph>Users Status</h2><p class=nt>How the crew at '+esc(S.ch)+' is doing with their tasks.</p>'+perBar();const st=udState();if(st)return h+st;
const c=udCalc(),L=udRoster(c),act=L.filter(r=>r.s.done>0).length,per=(S.up||'7')=='today';let k;
if(per){const [dn,tt]=udToday(c);k=[[tt?dn+'/'+tt:dn,'Tasks done'],[act+'/'+L.length,'Active crew'],[tt?tt-dn:'-','Still to do']]}else k=[[c.total,'Tasks done'],[act+'/'+L.length,'Active crew'],[c.days+'/'+c.n,'Active days']];
h+=`<div class=st>${k.map(([b,l])=>`<div><b>${b}</b><small>${l}</small></div>`).join('')}</div>`;
h+=L.length?`<div class=udl>${L.map(r=>udRow(r,c)).join('')}</div><p class=nt>Green dot: did a task today. Amber: active earlier in this period. Grey: nothing recorded. The bar is each person's share of the tasks done.</p>`:'<p class=nt>No crew members yet. Add users and give them the Crew or Oratory role in the admin panel.</p>';
return h+planCard()+'<button class=lk data-tab=chap>Open the chapel checklist &rsaquo;</button>'}
function udata(){if(!isLd())return udNo();if(UDU)return udet();
const bk=UB=='ustat'?['ustat','Users Status']:['home','Home'];
let h=`<button class="lk bk" data-tab="${bk[0]}">&lsaquo; ${bk[1]}</button><h2 class=ph>Users Data</h2><p class=nt>Profiles and task records for everyone in the app.</p>`+perBar();const st=udState();if(st)return h+st;
const c=udCalc(),ids=Object.keys(MEM).sort((a,b)=>(MEM[a].name||'').localeCompare(MEM[b].name||''));
return h+`<div class=udl>${ids.map(i=>{const u=MEM[i],s=c.by[i]||udEmpty(i),info=[u.course,u.section,u.year?yl(u.year):''].filter(Boolean).join(' · ');
return `<button class=udu data-ud="${esc(i)}">${av(u,42)}<span class=udm><b>${esc(u.name||u.username||'Unknown')}</b><small>${esc(RLS(u).map(k=>RS[k]).join(', ')||'No role yet')}</small>${info?`<small>${esc(info)}</small>`:''}</span>${isLU(u)?`<span class=udn><b class=udi>Info</b></span>`:`<span class=udn><b>${s.done}</b><small>${s.done==1?'task':'tasks'}</small></span>`}</button>`}).join('')}</div>`}
function udet(){const u=MEM[UDU]||{id:UDU,name:'Former member',username:''},per=(S.up||'7')=='today';
let h=`<button class="lk bk" data-ud="">&lsaquo; All users</button><div class=udp>${av(u,84)}<h2 class=pn>${esc(u.name||u.username||'Unknown')}</h2>${u.username?`<small>@${esc(u.username)}</small>`:''}<div>${RLS(u).map(k=>`<i class=tg>${rlab(k)}</i>`).join('')}</div></div>`;
if(isLU(u)){const fd=RLS(u).includes('founder'),ab=[['Roles',rtxt(u)||'Not assigned'],['Course',u.course||'Not set'],...(fd?[['Current status',u.status||'Not set']]:[['Section',u.section||'Not set'],['Year level',yl(u.year)]])];
return h+sec('About','',ab.map(([a,b])=>`<div class=ab><span>${a}</span><b>${esc(b)}</b></div>`).join(''))}
h+=perBar();const st=udState();if(st)return h+st;
const c=udCalc(),s=c.by[UDU]||udEmpty(UDU),sh=c.total?Math.round(100*s.done/c.total):0;
h+=`<div class=st><div><b>${s.done}</b><small>Tasks done</small></div><div><b>${s.days.size}/${c.n}</b><small>Active days</small></div><div><b>${sh}%</b><small>Of the crew's tasks</small></div></div>`;
const ab=[['Course',u.course],['Section',u.section],['Year level',u.year?yl(u.year):''],['Status',u.status],['Last active',s.done?udWhen(s,false):'No tasks in this period']].filter(x=>x[1]);
h+=sec('About','',ab.map(([a,b])=>`<div class=ab><span>${a}</span><b>${esc(b)}</b></div>`).join(''));
const mx=Math.max(1,...UCATS.map(k=>s.cat[k]||0));
h+=sec('What they did','',`<div class=udc>${UCATS.map(k=>`<div><span>${k}</span><div class=pb><i style="width:${100*(s.cat[k]||0)/mx}%"></i></div><b>${s.cat[k]||0}</b></div>`).join('')}</div>`);
const rec=[...s.list].sort((a,b)=>String(b.created_at||b.day).localeCompare(String(a.created_at||a.day))).slice(0,15);
h+=sec('Recent tasks',per?'Today':'Latest 15 in this period',rec.length?rec.map(x=>`<div class="ab ur"><span>${esc(tname(x.task,x.day))}</span><b>${x.created_at?dl(x.created_at)+', '+tm(x.created_at):dl(x.day+'T12:00:00')}</b></div>`).join(''):'<p class=nt>No tasks recorded in this period.</p>');
return h}
