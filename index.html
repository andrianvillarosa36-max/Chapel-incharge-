<script>
const $=s=>document.querySelector(s),ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
let S={ch:'CITE',tab:'today',pt:'mass',date:'',d:{},o:{},u:{},th:'',n:{},hc:0,hr:0,f:'',rb:{},lm:[],tm:'auto',ly:'detailed'};
try{Object.assign(S,JSON.parse(localStorage.getItem('cic')||'{}'))}catch(e){}
S.date=ymd(new Date());S.tab='today';S.q='';
{const c=ymd(new Date(Date.now()-60*864e5));for(const m of['d','o','n','rb'])for(const k in S[m])if(k<c)delete S[m][k]}
if(!S.f)S.f=ymd(new Date());
const sv=()=>{try{localStorage.setItem('cic',JSON.stringify(S))}catch(e){}};
const O=()=>S.o[S.date]||(S.o[S.date]=(i=>({m:'mass',f:i.f,c:i.f?'':i.c}))(lit(new Date(S.date+'T00:00')))),D=()=>S.d[S.date]||(S.d[S.date]={});
const DN=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DAILY=[
["Wipe surfaces","Use the designated cloth on the sacristy table, credence tables (oratory and sacristy), lectern, small tables and pews. Do this before placing any liturgical items."],
["Clean and refill lamps and candles","Vegetable oil for the vigil lamp; paraffin oil for the oil candles, as needed."],
["Clean the floors","Chapel, sacristy and confessional room."],
["Clean the bases","Missal stand and altar microphone stand."],
["Clean, dry and fill the cruets","Fresh wine and water every morning before Holy Mass."],
["Hands clean and dry; white gloves","Before handling any liturgical items."]];
const WEEK={
1:["Liturgical vessels","Wipe and polish the chalices and ciboria with the designated cloth. No metal polish: use a clean cloth dampened with clean water. No fingerprints, stains or marks."],
2:["Microphones","Clean and inspect all microphones: clean, in good condition, working properly."],
3:["Air fresheners and humidity","Check the air fresheners in the chapel, sacristy, confessional and chaplain's office. Check the sacristy dehumidifier is working (protects vestments and books)."],
4:["Oratory supplies inventory","Check large and small hosts, Mass wine (Mompo), air fresheners, dehumidifier, cleaning rags, vegetable oil and paraffin oil. Log them in the Supplies tab."],
5:["Vestment laundry","Inspect and collect vestments that need laundering; coordinate with the authorized administrative personnel to submit them."],
6:["Wash rags and gloves","Wash the used cleaning rags and gloves this afternoon in the dormitory."]};
const MON=[
{wd:1,n:1,l:'1st Monday',t:'Tabernacle (priest)',x:()=>'The priest cleans the tabernacle and replaces its corporal.'},
{wd:6,n:1,l:'1st Saturday',t:'Sacristy drawers and altar linen',x:c=>'Clean all drawers and cabinets in the sacristy. '+(c=='CITE'?'Replace the front altar linen':'Replace the altar linen')+' (Ordinary or Feast Days).'},
{wd:6,n:2,l:'2nd Saturday',t:'Chapel and Room 105 cabinets',x:()=>'Clean all drawers and cabinets in the chapel and Room 105.'},
{wd:6,n:3,l:'3rd Saturday',t:"Chaplain's office",x:()=>"General cleaning: floors, bookshelves, cabinets. General Services staff clean the chapel's glass windows, doors and restrooms."},
{wd:6,n:4,l:'4th Saturday',t:'Gymnasium liturgical items',x:()=>'Clean, organize and properly arrange all liturgical items stored in the gymnasium.'}];
const CLOSE=[
["Lights, sound system and A/C off","After 5:00 PM, after CITE office hours, or when all activities in the chapel or Room 105 end."],
["Fans and appliances off and unplugged","Only the vigil lamp stays lit at all times."],
["Doors locked, windows closed","Protects the Blessed Sacrament and liturgical items. If in doubt, ask the Security Guard on duty to check the premises."]];
const a=(t,w,x,s)=>({t,w,x,s}),C=f=>f?'Gold':(O().c||'White, Violet, Green or Red (per Ordo)');
const PM=f=>[
a('Liturgical vestments','Day before','Complete if possible; be ready in the sacristy.',['Chasuble: '+C(f),'Stole: '+C(f),'Cincture','Alb (one short ribbon)','Amice (two long ribbons)']),
a('Chalice set and two handkerchiefs','Day before','Ready for pickup from the sacristy the morning before Mass.',['Chalice','Purificator','Paten','Large host','Pall','Chalice veil: '+C(f),'Burse: '+C(f),'Corporal']),
a('Liturgical books','Day before','Ready for pickup from the sacristy the morning before Mass.',['Roman Missal (Cebuano, English or Latin): check the Ordo for the Mass of the day, prayers and color','Missal ribbons: Entrance Antiphon, Collect, Prayer over the Offerings, Preface, Prayer before Communion, Prayer after Communion, Solemn Blessing (if needed)','Lectionary: mark the readings of the day','Prayers of the Faithful: weekday, Sunday, feast or solemnity']),
a('Cruet set','Before Mass','Fill with the appropriate amounts of wine and water.',['Tray','Small spoon','Wine cruet (wine)','Water cruet (water)','Hand towel','Ablution glass']),
a('Ciborium with small hosts','Before Mass','Estimate the communicants and subtract the hosts left in the tabernacle, or ask the priest how many to prepare.'),
a('Altar linen','Day before','If needed.'),
a('Bell','Morning','Pick up from the cabinet.'),
a('Communion plate','Morning','Pick up from the cabinet.'),
a('Communion cloth','Morning','Pick up from the cabinet.'),
a('Triptych image','Morning','Put it on the small table in the chapel with a handkerchief for handling. Five minutes before Mass, place it on the back altar to cover the tabernacle.'),
a('Microphones (altar and lectern)','Before Mass','Place in the proper location.'),
a('Missal stand','Morning','Place on the credence table in the chapel with a handkerchief for handling.'),
a('Tray with lighter or matches and candle snuffer','Before Mass','Place in the proper location.'),
a('Flowers (if needed)','Day before','Complete if possible.'),
a('Tabernacle key (if needed)','Before Mass','Place in the proper location.'),
a('Altar candles','Before Mass',f?'Feast day: light all candles.':'Ordinary day: light two candles.'),
a('Air-conditioning on','Before Mass','Turn on about 30 minutes before Mass or any related activity in the chapel or Room 105.')];
const PB=()=>[a('Surplice','','Ordinary or feast days.'),a('Stole','','Ordinary or feast days.'),a('Corporals','','Front and rear altars, as applicable.'),a('Book and Benediction guide','','The book with the selected Scripture texts and the guide for Benediction of the Blessed Sacrament.'),a('Bell'),a('Humeral veil'),a('Tabernacle key'),a('Altar candles','',S.ch=='CITE'?'CITE: light the candles on both the front and back altars.':'Prepare the altar candle lighting arrangements.'),a('Tabernacle veil','','Use the white tabernacle veil (ordinary or feast days).'),...(S.ch=='CITE'?[a('Altar crucifix','CITE','Remove before Benediction; return it to its original position afterward.')]:[])];
const PMED=['Meditation table','Meditation cloth','Chair','Microphone','Crucifix','Lamp'].map(t=>a(t));
const SUP=['Large communion hosts','Small communion hosts','Mass wine (Mompo)','Air fresheners','Dehumidifier','Cleaning rags','Vegetable oil','Paraffin oil'],ST=['OK','Low','Out'];

function it(id,t,x,tag,subs){const k=D()[id];
return `<div class="it${k?' dn':''}"><label><input type=checkbox data-id="${id}"${k?' checked':''}><span><b>${t}</b>${tag?`<i class=tg>${tag}</i>`:''}<small>${x||''}</small></span></label>${subs?`<details><summary>Item list</summary>${subs.map((s,j)=>`<label class="sb${D()[id+'_'+j]?' dn':''}"><input type=checkbox data-id="${id}_${j}"${D()[id+'_'+j]?' checked':''}><span>${s}</span></label>`).join('')}</details>`:''}</div>`}
const sec=(h,n,b)=>`<section><h2>${h}</h2>${n?`<p class=nt>${n}</p>`:''}${b}</section>`;
function dbar(){const d=new Date(S.date+'T00:00');return `<div class=dt><button data-a=prev aria-label="Previous day">‹</button><div><b>${DN[d.getDay()]}</b><br>${d.toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'})}</div><button data-a=next aria-label="Next day">›</button></div>`+(S.date!=ymd(new Date())?`<button class=lk data-a=now>Back to today</button>`:'')}
function opts(){const o=O();return `<div class=ctl><select data-s=m aria-label="Day type">${[['mass','Holy Mass today'],['none','No Holy Mass'],['break','School break']].map(([v,l])=>`<option value=${v}${o.m==v?' selected':''}>${l}</option>`).join('')}</select><label class=sw><input type=checkbox data-s=f${o.f?' checked':''}> Feast day</label></div>`}
function today(){const d=new Date(S.date+'T00:00'),w=d.getDay(),o=O(),n=Math.ceil(d.getDate()/7);
let h=(ME?`<h2>${gr()}, ${esc((ME.name||'').split(' ')[0])}</h2>`:'')+dbar()+ordo()+opts()+'<div id=pg></div>';
if(S.date==ymd(new Date()))h+=missed();
const dn=o.m=='mass'||(o.m=='break'&&(w==0||w==3));
h+=sec('Daily cleaning',o.m=='none'?'No Holy Mass today, so no daily cleaning.':(o.m=='break'&&!dn)?'School break: the chapel is cleaned on Wednesdays and Sundays only.':'',dn?DAILY.map((x,i)=>it('d'+i,x[0],x[1])).join(''):'');
if(o.m=='mass')h+='<button class="lk big" data-a=prep>Open the Mass preparation checklist</button>';
h+=sec('Weekly task: '+DN[w],'',WEEK[w]?it('w',WEEK[w][0],WEEK[w][1]):'<p class=nt>No weekly task on Sundays.</p>');
const m=MON.filter(x=>x.wd==w&&x.n==n);
if(m.length)h+=sec('Monthly task','',m.map((x,i)=>it('mo'+i,x.t,x.x(S.ch),x.l)).join(''));
return h+sec('Closing, after 5:00 PM','',CLOSE.map((x,i)=>it('c'+i,x[0],x[1])).join(''))+"<button class=lk data-a=reset>Reset this day's checklist</button>"}
function prep(){const f=O().f,t=S.pt;
const L=t=='mass'?PM(f):t=='ben'?PB():PMED;
return dbar()+ordo()+`<div class=seg>${[['mass','Holy Mass'],['ben','Benediction'],['med','Meditation']].map(([v,l])=>`<button data-pt=${v} class="${t==v?'on':''}">${l}</button>`).join('')}</div>`+opts()+(t=='mass'?extra(f):'')+'<div id=pg></div>'+L.map((x,i)=>it('P'+t+i,x.t,x.x,x.w,x.s)).join('')}
function plan(){const w=new Date(S.date+'T00:00').getDay();
return sec('Daily','Done whenever Holy Mass is celebrated, Monday to Sunday. No Mass, no daily cleaning. During school breaks the chapel is cleaned every Wednesday and Sunday.',`<ol>${DAILY.map(x=>`<li><b>${x[0]}</b>: ${x[1]}</li>`).join('')}</ol>`)
+sec('Weekly','',[1,2,3,4,5,6].map(i=>`<div class="pl${i==w?' now':''}"><b>${DN[i]}</b> ${WEEK[i][0]}<small>${WEEK[i][1]}</small></div>`).join(''))
+sec('Monthly ('+S.ch+')','',MON.map(x=>`<div class=pl><b>${x.l}</b> ${x.t}<small>${x.x(S.ch)}</small></div>`).join(''))
+sec('Closing, after 5:00 PM','',CLOSE.map(x=>`<div class=pl><b>${x[0]}</b><small>${x[1]}</small></div>`).join(''))+hist()+rem()+sec('Offline status','','<p class=nt id=off>Checking...</p>')}
const ics=()=>{const t=(S.rt||'06:00').replace(':',''),d=ymd(new Date()).replace(/-/g,'');
return 'data:text/calendar;charset=utf-8,'+encodeURIComponent(['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//ChapelList//EN','BEGIN:VEVENT','UID:chapel-'+t+'@chapel-list','DTSTAMP:'+d+'T000000Z','DTSTART:'+d+'T'+t+'00','DURATION:PT15M','RRULE:FREQ=DAILY','SUMMARY:Chapel List: daily cleaning and Mass prep','BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Chapel List','TRIGGER:PT0S','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n'))};
function rem(){const t=S.rt||'06:00';
return sec('Daily reminder','Pick a time, tap Add to calendar, then open the downloaded file to save a repeating daily reminder. For a ringing alarm, use your phone Clock app.',`<div class=ctl><input type=time id=rt value="${t}" style="flex:1;font:inherit;padding:8px;border-radius:10px;border:1px solid var(--ln);background:var(--card);color:var(--ink)"><a class="lk big" id=ra download="chapel-reminder.ics" href="${ics()}">Add to calendar</a></div>`)}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function extra(f){const c=O().c||'';
return (f?'':`<div class=ctl><span>Vestment color</span><select data-s=c>${['','White','Violet','Green','Red'].map(v=>`<option value="${v}"${c==v?' selected':''}>${v||'Per Ordo'}</option>`).join('')}</select></div>`)
+`<div class="it wide"><b>Small hosts to prepare</b><small>Expected communicants minus consecrated hosts left in the tabernacle.</small><div class=ctl><input class=nm type=number inputmode=numeric min=0 data-h=hc value="${S.hc||''}" placeholder="Communicants"><input class=nm type=number inputmode=numeric min=0 data-h=hr value="${S.hr||''}" placeholder="In tabernacle"><b id=hn style="font-size:24px;min-width:44px;text-align:center">${Math.max(0,S.hc-S.hr)}</b></div></div>`+rib()}
